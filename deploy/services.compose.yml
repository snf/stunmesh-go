# Optional overlay for deploy/compose.example.yml, on nas only.
# Same reviewed image; these forwarders have no WG configuration/key mount.
# Their listeners exist only on the VPN address in the vpn network namespace.
services:
  vpn-ssh:
    image: "${STUNMESH_IMAGE:?Set the verified local image digest}"
    pull_policy: never
    container_name: stunmesh-ssh
    network_mode: "service:vpn"
    depends_on: [vpn]
    entrypoint: [/bin/busybox, nc]
    command: [-lk, -s, 10.77.0.1, -p, "22", -e, /bin/busybox, nc, 169.254.1.2, "22"]
    user: "0:0"
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    read_only: true
    restart: "no"
    pids_limit: 64
    mem_limit: 32m
    logging: {driver: journald}
  vpn-smb:
    image: "${STUNMESH_IMAGE:?Set the verified local image digest}"
    pull_policy: never
    container_name: stunmesh-smb
    network_mode: "service:vpn"
    depends_on: [vpn]
    entrypoint: [/bin/busybox, nc]
    command: [-lk, -s, 10.77.0.1, -p, "445", -e, /bin/busybox, nc, 169.254.1.2, "445"]
    user: "0:0"
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    read_only: true
    restart: "no"
    pids_limit: 64
    mem_limit: 32m
    logging: {driver: journald}
