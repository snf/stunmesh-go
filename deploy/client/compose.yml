services:
  client:
    # Load the reviewed OCI archive first; never fetch an image at startup.
    image: "${STUNMESH_IMAGE:?Set the verified local image digest}"
    pull_policy: never
    container_name: stunmesh-client
    network_mode: "pasta:--ipv4-only"
    ports:
      # Preserve the shared STUN/WG socket's port through rootless networking.
      - "${CLIENT_BIND_IP:-0.0.0.0}:51830:51830/udp"
    user: "0:0"
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    security_opt: [no-new-privileges:true]
    read_only: true
    restart: "no"
    pids_limit: 128
    stop_grace_period: 15s
    environment:
      TUNNEL_ADDRESS: "10.77.0.254/32"
      TUNNEL_ROUTES: "10.77.0.1/32"
    volumes:
      - type: bind
        source: "${STUNMESH_CONFIG:?Set the absolute private configuration directory}"
        target: /config
        read_only: true
        bind: {create_host_path: false}
    tmpfs:
      - /run:rw,nosuid,nodev,noexec,size=4m,mode=755
    logging: {driver: journald}
